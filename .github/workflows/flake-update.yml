name: Update Flake Lock

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    name: Update Flake Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Update flake.lock
        run: nix flake update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0f68c164746f096eb252d43a60a3e813f2 # v7.0.8
        with:
          token: ${{ secrets.GH_PAT || secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(flake): update inputs in flake.lock"
          title: "chore(flake): update inputs in flake.lock"
          body: |
            Automated weekly flake inputs update.

            CI will run flake checks and host evaluations across all machines (`michael`, `francis`, `zita`, `agnes`, `jerome`) to surface any deprecations or evaluation issues.
          base: master
          branch: chore/flake-update
          delete-branch: true
          labels: |
            dependencies
            automated

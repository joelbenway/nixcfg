name: Update Flake Lock

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    name: Update Flake Inputs
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
      branch: chore/flake-update
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: master
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Update flake.lock
        run: |
          sed -i '/self.submodules = true;/d' flake.nix
          nix flake update
          git checkout flake.nix

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "chore(flake): update inputs in flake.lock"
          title: "chore(flake): update inputs in flake.lock"
          body: |
            Automated weekly flake inputs update.

            This workflow automatically runs `nix flake check` and evaluates all 6 hosts (`michael`, `francis`, `zita`, `agnes`, `jerome`, `therese`) before merging into `master`.
          base: master
          branch: chore/flake-update
          delete-branch: true
          labels: |
            dependencies
            automated

  verify-flake-check:
    name: Verify Flake Check
    needs: update-flake
    if: needs.update-flake.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: chore/flake-update
          persist-credentials: false

      - name: Initialize secrets submodule or placeholders
        uses: ./.github/actions/setup-secrets
        with:
          ssh-key: ${{ secrets.SECRETS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Run nix flake check
        run: nix flake check --show-trace

  verify-eval-hosts:
    name: Verify Host (${{ matrix.host }})
    needs: update-flake
    if: needs.update-flake.outputs.pr-number != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - agnes
          - francis
          - jerome
          - michael
          - therese
          - zita
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: chore/flake-update
          persist-credentials: false

      - name: Initialize secrets submodule or placeholders
        uses: ./.github/actions/setup-secrets
        with:
          ssh-key: ${{ secrets.SECRETS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Evaluate host system derivation
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          if [ "$HOST" = "therese" ]; then
            nix eval ".#nixosConfigurations.${HOST}.config.system.build.isoImage.drvPath"
          else
            nix eval ".#nixosConfigurations.${HOST}.config.system.build.toplevel.drvPath"
          fi

  merge-pr:
    name: Auto-Merge Verified Flake Update
    needs:
      - update-flake
      - verify-flake-check
      - verify-eval-hosts
    runs-on: ubuntu-latest
    steps:
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.update-flake.outputs.pr-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge --delete-branch

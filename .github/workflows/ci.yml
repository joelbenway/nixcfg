name: CI

on:
  push:
    branches:
      - master
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: "3.97.9"
          extra_args: --only-verified

  lint-nix:
    name: Nix Linting (Alejandra & Statix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Check formatting with Alejandra
        run: |
          set -euo pipefail
          nixpkgs_rev=$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev')
          nix run "github:nixos/nixpkgs/${nixpkgs_rev}#alejandra" -- --check .

      - name: Lint with Statix
        run: |
          set -euo pipefail
          nixpkgs_rev=$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev')
          nix run "github:nixos/nixpkgs/${nixpkgs_rev}#statix" -- check .

  lint-shell:
    name: Shell Script Linting (ShellCheck & Shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Discover shell scripts
        id: scripts
        run: |
          set -euo pipefail
          mapfile -t files < <(
            while IFS= read -r f; do
              if [[ "$f" == *.sh ]]; then
                printf '%s\n' "$f"
              elif head -n 1 "$f" | grep -qE '^#![[:space:]]*(/[^[:space:]]*/)?(env[[:space:]]+)?(ba|da|k|z)?sh([[:space:]]|$)'; then
                printf '%s\n' "$f"
              elif sed -n '2p' "$f" | grep -qE '^#![[:space:]]*nix-shell[[:space:]]+.*-i[[:space:]]+(ba|da|k|z)?sh([[:space:]]|$)'; then
                printf '%s\n' "$f"
              fi
            done < <(git ls-files 'scripts/' 'pkgs/') | sort -u
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found!" >&2
            exit 1
          fi
          printf 'Discovered %d shell scripts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run ShellCheck
        env:
          FILES: ${{ steps.scripts.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$FILES"
          nixpkgs_rev=$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev')
          nix run "github:nixos/nixpkgs/${nixpkgs_rev}#shellcheck" -- "${files[@]}"

      - name: Check Shell Formatting with Shfmt
        env:
          FILES: ${{ steps.scripts.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$FILES"
          nixpkgs_rev=$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev')
          nix run "github:nixos/nixpkgs/${nixpkgs_rev}#shfmt" -- -d -i 2 -ci "${files[@]}"

  lint-workflows:
    name: Workflow Linting (Actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Run Actionlint
        run: |
          set -euo pipefail
          nixpkgs_rev=$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev')
          nix run "github:nixos/nixpkgs/${nixpkgs_rev}#actionlint"

  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize secrets submodule or placeholders
        uses: ./.github/actions/setup-secrets
        with:
          ssh-key: ${{ secrets.SECRETS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Run nix flake check
        run: nix flake check --show-trace

  eval-hosts:
    name: Evaluate Host (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - agnes
          - francis
          - jerome
          - michael
          - therese
          - zita
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize secrets submodule or placeholders
        uses: ./.github/actions/setup-secrets
        with:
          ssh-key: ${{ secrets.SECRETS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Evaluate host system derivation
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          if [ "$HOST" = "therese" ]; then
            nix eval ".#nixosConfigurations.${HOST}.config.system.build.isoImage.drvPath"
          else
            nix eval ".#nixosConfigurations.${HOST}.config.system.build.toplevel.drvPath"
          fi

name: CI

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  format-check:
    name: Code Formatting (Alejandra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check Nix code formatting
        run: nix run nixpkgs#alejandra -- --check .

  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize secrets submodule (if SSH key configured)
        env:
          SSH_KEY: ${{ secrets.SECRETS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "Initializing private secrets submodule..."
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git submodule update --init --recursive
          else
            echo "Secrets SSH key not configured; skipping submodule checkout."
          fi

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run nix flake check
        run: nix flake check --show-trace
